<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="BlazingDL Engine Pipeline Architecture">
  <rect width="1200" height="330" fill="#090A0C"/>
  <rect x="0.5" y="0.5" width="1199" height="329" fill="none" stroke="#23262E" stroke-width="1"/>

  <!-- Header band -->
  <rect x="1" y="1" width="1198" height="38" fill="#0E0F11"/>
  <line x1="0" y1="39" x2="1200" y2="39" stroke="#23262E" stroke-width="1"/>
  <rect x="20" y="13" width="6" height="14" fill="#E04826"/>
  <text x="36" y="24" fill="#ECEBE7" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.8">BLAZINGDL TRANSFER &amp; AUTOMATION PIPELINE</text>
  <text x="1180" y="24" text-anchor="end" fill="#9498A0" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" letter-spacing="1">ZERO UNSAFE ENGINE · PURE RUST TLS</text>

  <!-- Column 1: INTAKE -->
  <rect x="24" y="62" width="248" height="244" fill="#111317" stroke="#23262E" stroke-width="1"/>
  <rect x="24" y="62" width="248" height="4" fill="#E04826"/>
  <text x="40" y="90" fill="#F27435" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.6">01 · INTAKE</text>
  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ECEBE7">
    <rect x="40" y="106" width="216" height="28" fill="#0B0C0E" stroke="#23262E"/>
    <text x="52" y="124">Quick-Add Strip (Ctrl+L)</text>
    <rect x="40" y="142" width="216" height="28" fill="#0B0C0E" stroke="#23262E"/>
    <text x="52" y="160">Browser Extension + NMHost</text>
    <rect x="40" y="178" width="216" height="28" fill="#0B0C0E" stroke="#23262E"/>
    <text x="52" y="196">Metalink (.meta4 / .metalink)</text>
    <rect x="40" y="214" width="216" height="28" fill="#0B0C0E" stroke="#23262E"/>
    <text x="52" y="232">Usenet (.nzb) &amp; Magnets</text>
    <rect x="40" y="250" width="216" height="28" fill="#0B0C0E" stroke="#23262E"/>
    <text x="52" y="268">CLI · Remote Web UI · MCP</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="272" y1="184" x2="314" y2="184" stroke="#9498A0" stroke-width="1.5"/>
  <polygon points="314,179 324,184 314,189" fill="#ECEBE7"/>

  <!-- Column 2: CORE ENGINE -->
  <rect x="324" y="62" width="528" height="244" fill="#111317" stroke="#23262E" stroke-width="1"/>
  <rect x="324" y="62" width="528" height="4" fill="#2460B8"/>
  <text x="342" y="90" fill="#ECEBE7" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.6">02 · HIGH-THROUGHPUT TRANSPORT ENGINE</text>

  <!-- Sub-card A: Multi-NIC -->
  <rect x="342" y="106" width="240" height="86" fill="#0B0C0E" stroke="#23262E"/>
  <rect x="342" y="106" width="4" height="86" fill="#2460B8"/>
  <text x="356" y="128" fill="#ECEBE7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Multi-NIC Aggregation</text>
  <text x="356" y="148" fill="#9498A0" font-family="ui-monospace, Consolas, monospace" font-size="11">Route::Aggregate(NICs)</text>
  <text x="356" y="166" fill="#9498A0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Ethernet + Wi-Fi + 5G bonded</text>
  <text x="356" y="182" fill="#9498A0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Per-NIC live byte telemetry</text>

  <!-- Sub-card B: Adaptive & Hedged -->
  <rect x="594" y="106" width="240" height="86" fill="#0B0C0E" stroke="#23262E"/>
  <rect x="594" y="106" width="4" height="86" fill="#E04826"/>
  <text x="608" y="128" fill="#ECEBE7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Adaptive + Hedged Tail</text>
  <text x="608" y="148" fill="#9498A0" font-family="ui-monospace, Consolas, monospace" font-size="11">AdaptiveScaler + preempt</text>
  <text x="608" y="166" fill="#9498A0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Scales workers vs disk/gain</text>
  <text x="608" y="182" fill="#9498A0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Preempts stalled tail chunks</text>

  <!-- Sub-card C: Multi-Mirror + NZB -->
  <rect x="342" y="204" width="240" height="86" fill="#0B0C0E" stroke="#23262E"/>
  <rect x="342" y="204" width="4" height="86" fill="#DFB516"/>
  <text x="356" y="226" fill="#ECEBE7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Mirror Racing &amp; Usenet</text>
  <text x="356" y="246" fill="#9498A0" font-family="ui-monospace, Consolas, monospace" font-size="11">Metalink v4/v3 + NNTP/TLS</text>
  <text x="356" y="264" fill="#9498A0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">60s bad-mirror auto-cooldown</text>
  <text x="356" y="280" fill="#9498A0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">yEnc + per-segment CRC32</text>

  <!-- Sub-card D: Focus & 24h Curve -->
  <rect x="594" y="204" width="240" height="86" fill="#0B0C0E" stroke="#23262E"/>
  <rect x="594" y="204" width="4" height="86" fill="#28A763"/>
  <text x="608" y="226" fill="#ECEBE7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Focus &amp; 24h Curve</text>
  <text x="608" y="246" fill="#9498A0" font-family="ui-monospace, Consolas, monospace" font-size="11">FocusController + Limiter</text>
  <text x="608" y="264" fill="#9498A0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Fullscreen D3D auto-throttle</text>
  <text x="608" y="280" fill="#9498A0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Hourly cap schedule (0..23h)</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="852" y1="184" x2="894" y2="184" stroke="#9498A0" stroke-width="1.5"/>
  <polygon points="894,179 904,184 894,189" fill="#ECEBE7"/>

  <!-- Column 3: POST-PROCESSING -->
  <rect x="904" y="62" width="272" height="244" fill="#111317" stroke="#23262E" stroke-width="1"/>
  <rect x="904" y="62" width="272" height="4" fill="#28A763"/>
  <text x="920" y="90" fill="#28A763" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.6">03 · VERIFY &amp; AUTOMATE</text>
  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ECEBE7">
    <rect x="920" y="106" width="240" height="36" fill="#0B0C0E" stroke="#23262E"/>
    <text x="932" y="128">Smart SHA-512/256 Auto-Match</text>
    <rect x="920" y="150" width="240" height="36" fill="#0B0C0E" stroke="#23262E"/>
    <text x="932" y="172">Archive Test, Extract &amp; Repair</text>
    <rect x="920" y="194" width="240" height="36" fill="#0B0C0E" stroke="#23262E"/>
    <text x="932" y="216">Regex Rules → Move &amp; Exec</text>
    <rect x="920" y="238" width="240" height="36" fill="#0B0C0E" stroke="#23262E"/>
    <text x="932" y="260">Discord · ntfy · JSON Webhooks</text>
  </g>
</svg>
