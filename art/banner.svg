  <rect x="920" y="249" width="8" height="14" fill="#ECEBE7"/>
  <text x="938" y="260" fill="#ECEBE7" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">WEBHOOKS · CLI · MCP</text>
