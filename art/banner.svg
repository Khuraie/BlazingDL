    <line x1="458" y1="110" x2="1158" y2="110" stroke="#181B21" stroke-width="1"/>
    <line x1="458" y1="142" x2="1158" y2="142" stroke="#181B21" stroke-width="1"/>
    <line x1="458" y1="174" x2="1158" y2="174" stroke="#181B21" stroke-width="1"/>
    <line x1="458" y1="204" x2="1158" y2="204" stroke="#23262E" stroke-width="1"/>

