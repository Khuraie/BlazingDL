    <polyline stroke="#F27435" stroke-width="2"
      points="458,78 518,78 552,75 586,69 616,58 644,64 672,46 698,28 722,51 748,22 774,38 802,18 828,44 854,26 882,53 912,56 944,68 978,64 1014,72 1054,76 1158,78"/>
