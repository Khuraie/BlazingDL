  </g>

  <!-- Telemetry label in top right -->
  <text x="1158" y="32" text-anchor="end" fill="#ECEBE7" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="13.5" font-weight="700" letter-spacing="1.0">MULTI-NIC · HEDGED TAIL</text>
  <text x="1158" y="50" text-anchor="end" fill="#F27435" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="10.5" letter-spacing="0.8">ETH + WI-FI + 5G AGGREGATION</text>

