<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="BlazingDL — High-Throughput Native Rust Download Manager">
  <rect width="1200" height="280" fill="#090A0C"/>
  <rect x="0.5" y="0.5" width="1199" height="279" fill="none" stroke="#23262E" stroke-width="1"/>

