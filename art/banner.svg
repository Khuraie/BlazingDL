  <line x1="420" y1="0" x2="420" y2="232" stroke="#23262E" stroke-width="1"/>
  <line x1="0" y1="232" x2="1200" y2="232" stroke="#23262E" stroke-width="1"/>

  <!-- Signal Ember leading bar -->
  <rect x="0" y="0" width="6" height="232" fill="#E04826"/>

  <!-- Wordmark & metadata -->
