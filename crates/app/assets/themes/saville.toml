# BlazingDL default theme: Saville Catalog Pulse.
# Absorbent matte-black shell, warm bone-white ink, strict 0px architectural geometry,
# 1px hairline rules, and flat matte signal color blocks.

name = "BlazingDL (Saville)"
icons = "mono"

[controls]
field-focus = "border"
check = "square"
progress = "bar"
caption = "metro"

[sizes]
radius = 0
"radius.button" = 0
"radius.part" = 0
"radius.check" = 0
"radius.flyout" = 0
"radius.menu-item" = 0
"radius.popup" = 0
"radius.egui" = 0
"list.row" = 32
"list.header" = 28

